# Builds the nightly viral-load files and deploys the site to Cloudflare.
# Runs every night, on every push to main, and on demand (Actions tab -> Run workflow).
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Repo variable WRANGLER_ENV picks the target: empty = staging (wrangler.toml top level),
# "production" = [env.production]. See docs/SOP.md.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 8 * * *' # 08:30 UTC = 03:30 Eastern (04:30 in summer)
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build viral-load files from the portal API
        run: npm run build:data
      - name: Deploy to Cloudflare
        run: npx wrangler deploy --env="$WRANGLER_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: ${{ vars.WRANGLER_ENV }}
