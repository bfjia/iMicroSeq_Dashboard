# Staging: this repo deploys to imicroseq-dashboard.bfjia.net.
# Production (dashboard.imicroseq-dataportal.ca) deploys from the production repo with --env production.
name = "imicroseq-dashboard"
main = "cf-worker/index.ts"
compatibility_date = "2026-11-01"
routes = [{ pattern = "imicroseq-dashboard.bfjia.net", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
# Only these paths run the Worker. Everything else is a free static-asset request.
run_worker_first = ["/api/*", "/tiles/*"]

[observability]
enabled = true

# Nightly at 08:30 UTC the Worker calls DEPLOY_HOOK_URL (a secret), so Workers Builds
# rebuilds the viral data from main and redeploys. See docs/SOP.md section 3.
[triggers]
crons = ["30 8 * * *"]

[env.production]
# Same name as the Worker that serves the production domain today, so cutover deploys over it in place.
name = "dashboard-imicroseq-dataportal-ca"
routes = [{ pattern = "dashboard.imicroseq-dataportal.ca", custom_domain = true }]
